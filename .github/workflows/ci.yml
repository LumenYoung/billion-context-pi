name: CI

on:
  pull_request:
    branches: [master, integrate/upstream-0.1.82-20260929]
  push:
    branches: [master, integrate/upstream-0.1.82-20260929]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          cache: npm
      # Test the committed release before a development build can repair it.
      - name: Install committed production artifacts
        shell: bash
        run: |
          test -n "$(git ls-files -- dist)"
          npm install --omit=dev --legacy-peer-deps --package-lock=false
      - run: npm ci
      - run: npm run typecheck
      # build before test: tests/host-api.test.ts resolves "billion-context-pi"
      # via Node self-reference to dist/index.js (package-name-only import contract)
      - run: npm run build
      # Git release commits carry prebuilt artifacts for production-only installs.
      - name: Verify complete, fresh committed artifacts
        shell: bash
        run: |
          git status --short --untracked-files=all -- dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"
      - run: npm run test:packaging
      - run: npm test

  pr-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci/check-pr.sh "${{ github.head_ref }}" "${{ github.event.pull_request.base.ref }}"
